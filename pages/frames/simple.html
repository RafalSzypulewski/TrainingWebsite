<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple frame</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <script src="../../assets/js/core/theme.js"></script>
</head>
<body style="display:block;min-height:0;padding:16px">
  <h2 data-testid="frame-title">Inside the simple frame</h2>
  <div class="field">
    <label for="frame-input">Frame input</label>
    <input type="text" id="frame-input" data-testid="frame-input">
  </div>
  <button type="button" class="btn" id="frame-btn">Say hello</button>
  <p id="frame-out" data-testid="frame-out" role="status"></p>
  <script>
    document.getElementById('frame-btn').addEventListener('click', () => {
      const name = document.getElementById('frame-input').value || 'stranger';
      document.getElementById('frame-out').textContent = 'Hello, ' + name + '!';
    });
  </script>
</body>
</html>
