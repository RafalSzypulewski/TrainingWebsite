<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inner frame</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <script src="../../assets/js/core/theme.js"></script>
</head>
<body style="display:block;min-height:0;padding:12px;background:#fff">
  <h3 data-testid="inner-title">Inner frame</h3>
  <button type="button" class="btn" id="inner-btn">Inner button</button>
  <p id="inner-out" data-testid="inner-out" role="status"></p>
  <script>
    document.getElementById('inner-btn').addEventListener('click', () => {
      document.getElementById('inner-out').textContent = 'Inner button clicked';
    });
  </script>
</body>
</html>
