name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (static files only)
        run: |
          mkdir _site
          cp -r index.html pages assets _site/
          touch _site/.nojekyll
      - name: Stamp version info (commit and build date)
        run: |
          node -e "
            const fs = require('fs');
            const file = '_site/assets/data/version.json';
            const info = JSON.parse(fs.readFileSync(file, 'utf8'));
            info.commit = process.env.GITHUB_SHA.slice(0, 7);
            info.built = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(file, JSON.stringify(info, null, 2));
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
